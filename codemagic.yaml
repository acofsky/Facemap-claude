# Codemagic CI/CD config — two workflows, both Linux-triggered, neither needs a Mac.
#
# ios-livereload: dev hot-reload builds for an internal TestFlight group on your phone.
#                 Bakes CAP_LIVE_RELOAD into the IPA so the installed app loads from
#                 your laptop's Vite server over a cloudflared tunnel.
#
# ios-production: App Store / public TestFlight releases. Never sets CAP_LIVE_RELOAD,
#                 so the IPA is byte-equivalent to a vanilla Capacitor build.

definitions:
  env_versions: &env_versions
    node: 20
    xcode: latest
    cocoapods: default
  scripts:
    - &install_deps
      name: Install npm dependencies
      script: npm ci
    - &web_build
      name: Build web bundle
      script: npm run build
    - &cap_sync
      name: Capacitor sync iOS
      script: npx cap sync ios
    - &pod_install
      name: Install CocoaPods
      script: |
        cd ios/App
        pod install
    - &setup_signing
      name: Set up code signing (fetch or create on demand)
      script: |
        set -e
        keychain initialize
        app-store-connect fetch-signing-files com.acofsky.facemap \
          --type IOS_APP_STORE \
          --create
        keychain add-certificates
        # Restrict to the app's xcodeproj so use-profiles isn't distracted by
        # Pods.xcodeproj (which has no signing requirements and can confuse matching).
        xcode-project use-profiles \
          --xcode-project-patterns ios/App/App.xcodeproj \
          --warnings-as-errors
        echo "--- Signing settings after use-profiles: ---"
        grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY" \
          ios/App/App.xcodeproj/project.pbxproj | sort -u
    - &set_build_number
      name: Set iOS build number
      script: |
        cd ios/App
        # $BUILD_NUMBER is Codemagic's auto-incrementing per-workflow counter.
        # $BUILD_NUMBER_OFFSET lets each workflow shift its number range
        # (live-reload uses a high offset so its builds sort above production).
        agvtool new-version -all $((${BUILD_NUMBER_OFFSET:-0} + $BUILD_NUMBER))
    - &xcode_build
      name: Build IPA
      script: |
        xcode-project build-ipa \
          --workspace ios/App/App.xcworkspace \
          --scheme App

workflows:

  ios-livereload:
    name: iOS Live-Reload (internal TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: MembrCodeMagicAPIKey
    environment:
      <<: *env_versions
      vars:
        # Set LIVE_RELOAD_URL in Codemagic UI to your current cloudflared tunnel URL
        # (e.g. https://something.trycloudflare.com). Updated whenever the tunnel changes.
        CAP_LIVE_RELOAD: $LIVE_RELOAD_URL
        # Shift live-reload bundle versions into the 99000+ range so they sort
        # above production builds in App Store Connect and are unmistakable.
        BUILD_NUMBER_OFFSET: 99000
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/ios-simulator-setup-7878D
          include: true
    scripts:
      - *install_deps
      - *web_build
      - *cap_sync
      - *pod_install
      - *setup_signing
      - *set_build_number
      - *xcode_build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - LiveReload

  ios-production:
    name: iOS Production (App Store / public TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MembrCodeMagicAPIKey
    environment:
      <<: *env_versions
      vars:
        BUILD_NUMBER_OFFSET: 0
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - *install_deps
      - *web_build
      - *cap_sync
      - *pod_install
      - *setup_signing
      - *set_build_number
      - *xcode_build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - External Testers
        # When ready to ship to the App Store production track, set
        # submit_to_app_store: true and add release_type: AFTER_APPROVAL
        # (Codemagic rejects release_type unless submit_to_app_store is true).
        submit_to_app_store: false
