# Codemagic CI/CD config — two workflows, both Linux-triggered, neither needs a Mac.
#
# ios-livereload: internal-tester TestFlight builds. (ID kept as-is to preserve cache
#                 keying with the minted distribution cert. Display name describes
#                 actual purpose: "iOS Internal".) Triggered on push to the dev
#                 branch, or manually from Codemagic UI. ~10 min per build.
#
# ios-production: App Store / public TestFlight releases. Triggered only by v*.*.* tags.

definitions:
  env_versions: &env_versions
    node: 20
    xcode: latest
    cocoapods: default
  scripts:
    - &install_deps
      name: Install npm dependencies
      script: npm ci
    - &web_build
      name: Build web bundle
      script: npm run build
    - &cap_sync
      name: Capacitor sync iOS
      script: npx cap sync ios
    - &pod_install
      name: Install CocoaPods
      script: |
        cd ios/App
        pod install
    - &setup_signing
      name: Set up code signing (fetch or create on demand)
      script: |
        set -e
        keychain initialize
        # The team's existing dist cert was created on a different Mac, so its
        # private key isn't reachable here. We generate a fresh RSA key and
        # mint a brand new dist cert against it. Both the key and a flag file
        # live in the cached codemagic-cli-tools dir so subsequent builds
        # reuse them instead of re-minting (Apple caps dist certs at 3/team).
        CACHE_DIR=/Users/builder/Library/codemagic-cli-tools/cache
        CERT_KEY_PATH="$CACHE_DIR/dist_cert_key.pem"
        CERT_CACHE_FLAG="$CACHE_DIR/dist_cert_minted.flag"
        mkdir -p "$CACHE_DIR"
        if [ ! -f "$CERT_KEY_PATH" ]; then
          echo "Generating new RSA private key for distribution certificate"
          openssl genrsa -out "$CERT_KEY_PATH" 2048
        fi
        if [ ! -f "$CERT_CACHE_FLAG" ]; then
          echo "Minting new iOS distribution certificate"
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key="@file:$CERT_KEY_PATH" \
            --save
          touch "$CERT_CACHE_FLAG"
        fi
        app-store-connect fetch-signing-files com.acofsky.facemap \
          --type IOS_APP_STORE \
          --certificate-key="@file:$CERT_KEY_PATH" \
          --create
        keychain add-certificates
        xcode-project use-profiles
        echo "--- Signing settings after use-profiles: ---"
        grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY" \
          ios/App/App.xcodeproj/project.pbxproj | sort -u
    - &set_build_number
      name: Set iOS build number
      script: |
        cd ios/App
        # $BUILD_NUMBER is Codemagic's auto-incrementing per-workflow counter.
        # $BUILD_NUMBER_OFFSET lets each workflow shift its number range so
        # internal builds sort above production builds in App Store Connect.
        agvtool new-version -all $((${BUILD_NUMBER_OFFSET:-0} + $BUILD_NUMBER))
    - &xcode_build
      name: Build IPA
      script: |
        xcode-project build-ipa \
          --workspace ios/App/App.xcworkspace \
          --scheme App

workflows:

  ios-livereload:
    name: iOS Internal (TestFlight, every push)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: MembrCodeMagicAPIKey
    environment:
      <<: *env_versions
      vars:
        # Shift internal build numbers into the 99000+ range so they sort
        # above production builds in App Store Connect and are unmistakable.
        BUILD_NUMBER_OFFSET: 99000
    cache:
      cache_paths:
        - /Users/builder/Library/codemagic-cli-tools
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/pwa-to-ios-conversion-F3VuG
          include: true
    scripts:
      - *install_deps
      - *web_build
      - *cap_sync
      - *pod_install
      - *setup_signing
      - *set_build_number
      - *xcode_build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - LiveReload

  ios-production:
    name: iOS Production (App Store / public TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MembrCodeMagicAPIKey
    environment:
      <<: *env_versions
      vars:
        BUILD_NUMBER_OFFSET: 0
    cache:
      cache_paths:
        - /Users/builder/Library/codemagic-cli-tools
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - *install_deps
      - *web_build
      - *cap_sync
      - *pod_install
      - *setup_signing
      - *set_build_number
      - *xcode_build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - External Testers
        # When ready to ship to the App Store production track, set
        # submit_to_app_store: true and add release_type: AFTER_APPROVAL
        # (Codemagic rejects release_type unless submit_to_app_store is true).
        submit_to_app_store: false
