name: Supabase deploy (migrations + edge functions)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Push migrations + deploy edge functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: sgkjdtbrnxrirymneyyq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push --include-all

      # NOTIFY pgrst doesn't always force the hosted PostgREST instance to
      # actually reload — it's a hint that the listener can ignore if the
      # process is busy. The Management API restart hard-bounces the
      # PostgREST + GoTrue + Realtime services, which guarantees the
      # schema cache is rebuilt from current Postgres state. Run this
      # whenever a migration touches table or column shape.
      - name: Restart project services (force PostgREST schema reload)
        run: |
          curl -fsS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            && echo "Restart triggered" || echo "Restart endpoint failed (non-fatal)"
          # Give the services ~30s to come back before we hit them again.
          sleep 30

      - name: Set ANTHROPIC_API_KEY function secret
        run: supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

      - name: Deploy edge functions
        run: |
          supabase functions deploy describe-from-photo
          supabase functions deploy meeting-brief
          supabase functions deploy recall-search
          supabase functions deploy delete-account
