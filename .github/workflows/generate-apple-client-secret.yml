name: Generate Apple Sign In client secret (JWT)

# Supabase's Apple OAuth provider takes a pre-signed JWT as the "client
# secret" (Apple caps these at 6 months). This workflow signs one using
# the .p8 stored in repo secret APPLE_SIGN_IN_KEY plus the IDs you
# provide as inputs. Run it once per ~6 months; paste the output into
# Supabase → Authentication → Providers → Apple → Secret Key.

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: 'Apple Team ID (10 chars — top of developer.apple.com/account)'
        required: true
        default: 'C59FSCZHFV'
      service_id:
        description: 'Service ID / Client ID (e.g. com.acofsky.facemap.signin)'
        required: true
      key_id:
        description: 'Key ID for the Sign in with Apple key (10 chars)'
        required: true
      months:
        description: 'JWT validity in months (Apple caps at 6)'
        required: false
        default: '6'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          APPLE_SIGN_IN_KEY: ${{ secrets.APPLE_SIGN_IN_KEY }}
          TEAM_ID: ${{ inputs.team_id }}
          SERVICE_ID: ${{ inputs.service_id }}
          KEY_ID: ${{ inputs.key_id }}
          MONTHS: ${{ inputs.months }}
        run: |
          if [ -z "$APPLE_SIGN_IN_KEY" ]; then
            echo "::error::Repo secret APPLE_SIGN_IN_KEY is missing. Paste the .p8 contents (including BEGIN/END lines) into Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm i --silent --no-save jsonwebtoken@9
          node -e '
            const jwt = require("jsonwebtoken");
            const months = Math.min(6, Math.max(1, parseInt(process.env.MONTHS || "6", 10)));
            const now = Math.floor(Date.now() / 1000);
            const exp = now + months * 30 * 24 * 60 * 60;
            const token = jwt.sign(
              {
                iss: process.env.TEAM_ID,
                iat: now,
                exp,
                aud: "https://appleid.apple.com",
                sub: process.env.SERVICE_ID,
              },
              process.env.APPLE_SIGN_IN_KEY,
              { algorithm: "ES256", keyid: process.env.KEY_ID },
            );
            const expiresAt = new Date(exp * 1000).toISOString();
            console.log("\n========== APPLE SIGN IN CLIENT SECRET ==========\n");
            console.log(token);
            console.log("\n========== expires " + expiresAt + " ==========\n");
          '
